[package]
name = "deduxit-web-tab"
description = "The settings of a browser tab and the error a call throws, which deduxit's two WebAssembly modules share."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# The bindings' features but `png` and `pdf`: the settings' reader refuses an
# unknown key, and a field or variant a feature adds (`interactive`,
# `ordinary.method` "sat") would be unknown to a module built without it.
# So both modules accept the same settings.
deduxit = { workspace = true, features = [
  "interactive",
  "latex",
  "parse",
  "protocol",
  "rocq",
  "sat",
  "serialize",
  "svg",
  "typst",
] }
serde_json = "1.0.149"

[lints]
workspace = true

[dev-dependencies]
wasm-bindgen-test = "=0.3.80"
