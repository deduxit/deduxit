# The last release under the name linlog, which the crate had up to 0.2.0:
# it re-exports deduxit, so that a project that names linlog still builds
# against the current library. Its version stays 0.3.0, and no later
# release is made of it.
[package]
name = "linlog"
description = "Renamed deduxit: this last release re-exports the crate deduxit, where the library goes on."
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = [
  "linear-logic",
  "theorem-prover",
  "proof-search",
  "sequent-calculus",
  "deduxit",
]
categories = ["science", "mathematics"]

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
deduxit = { workspace = true }

# The features of linlog 0.2.0, each the same feature of deduxit.
[features]
default = ["interactive", "latex", "parse", "rocq", "serialize", "svg", "typst"]
interactive = ["deduxit/interactive"]
latex = ["deduxit/latex"]
parse = ["deduxit/parse"]
rocq = ["deduxit/rocq"]
serialize = ["deduxit/serialize"]
svg = ["deduxit/svg"]
typst = ["deduxit/typst"]
parallel = ["deduxit/parallel"]
pdf = ["deduxit/pdf"]
png = ["deduxit/png"]

[lints]
workspace = true
