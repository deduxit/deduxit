# linlog © Fabian Lukas Grubmüller 2026
# Licensed under the EUPL

# The last release under the name linlog-cli, which the command's package
# had up to 0.2.0: its binary linlog runs deduxit's command. Its version
# stays 0.3.0, and no later release is made of it.
[package]
name = "linlog-cli"
description = "Renamed deduxit-cli: this last release's command linlog runs the command deduxit."
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
# The command it runs embeds five math fonts, four under the OFL and New
# Computer Modern Math under the GUST Font License, which is the LPPL 1.3c.
license = "EUPL-1.2 AND OFL-1.1 AND LPPL-1.3c"
repository.workspace = true
documentation = "https://deduxit.github.io/deduxit/manual/"
readme = "README.md"
keywords = ["linear-logic", "theorem-prover", "proof-search", "cli", "deduxit"]
categories = ["command-line-utilities", "science", "mathematics"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[[bin]]
name = "linlog"
path = "src/main.rs"
doc = false

[dependencies]
deduxit-cli = { workspace = true }

[lints]
workspace = true
