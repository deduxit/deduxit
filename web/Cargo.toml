[package]
name = "deduxit-web"
description = "deduxit compiled to WebAssembly for a web page: JSON in, JSON or SVG out, over the interactive state, the settings and a search's outcome."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
deduxit = { workspace = true, features = [
  "interactive",
  "latex",
  "parse",
  "pdf",
  "png",
  "rocq",
  "serialize",
  "svg",
  "typst",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
wasm-bindgen = { version = "=0.2.130", default-features = false, features = [
  "std",
] }

[lints]
workspace = true

[dev-dependencies]
wasm-bindgen-test = "=0.3.80"
