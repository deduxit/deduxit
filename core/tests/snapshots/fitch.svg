<title>a ∨ b → b ∨ a</title>
<desc>Line 1, a ∨ b: a hypothesis, which opens a subproof.
Line 2, a: a hypothesis, which opens a subproof.
Line 3, b ∨ a: by ∨I₂ from line 2.
Line 4, b: a hypothesis, which opens a subproof.
Line 5, b ∨ a: by ∨I₁ from line 4.
Line 6, b ∨ a: by ∨E from line 1, the subproof of lines 2 to 3 and the subproof of lines 4 to 5.
Line 7, a ∨ b → b ∨ a: by →I from the subproof of lines 1 to 6.</desc>
