<svg xmlns="http://www.w3.org/2000/svg" role="img" width="130.528" height="153.6" viewBox="0 0 8158 9600" font-family="'Euler Math', 'Neo Euler', serif" font-size="1000" fill="black">
<title>A countermodel of □p, ◇¬q ⊢ q in S5</title>
<desc>A Kripke model of 3 worlds. An arrow points from a world to a world it sees.
World 0, the model's world, forces p; it sees itself, world 1 and world 2.
World 1 forces p; it sees world 0, itself and world 2.
World 2 forces p; it sees world 0, world 1 and itself.
At world 0 every formula left of ⊢ is true and every formula right of it false, so □p, ◇¬q ⊢ q is not valid in S5.</desc>
