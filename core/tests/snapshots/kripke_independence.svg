<svg xmlns="http://www.w3.org/2000/svg" role="img" width="143.52" height="105.6" viewBox="0 0 8970 6600" font-family="'Euler Math', 'Neo Euler', serif" font-size="1000" fill="black">
<title>A countermodel of a → (b ∨ c) ⊢ (a → b) ∨ (a → c)</title>
<desc>A Kripke model of 3 worlds. An arrow points from a world to a world above it, which forces everything the world below forces.
World 0, the model's world, forces nothing; worlds 1 and 2 are above it.
World 1 forces a and b.
World 2 forces a and c.
World 0 forces each formula left of ⊢ and not the one right of it, so a → (b ∨ c) ⊢ (a → b) ∨ (a → c) is not valid in intuitionistic logic.</desc>
