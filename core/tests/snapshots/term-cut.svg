<svg xmlns="http://www.w3.org/2000/svg" role="img" width="728.128" height="182.592" viewBox="0 0 45508 11412" font-family="'Euler Math', 'Neo Euler', serif" font-size="1000" fill="black">
<title>!a ⊢ a ⊗ a</title>
<desc>1. a ⊢ a, by ax.
2. !a ⊢ a, by !L from 1.
3. !a ⊢ !a, by !R from 2.
4. a ⊢ a, by ax.
5. a ⊢ a, by ax.
6. a, a ⊢ a ⊗ a, by ⊗R from 4 and 5.
7. !a, a ⊢ a ⊗ a, by !L from 6.
8. !a, !a ⊢ a ⊗ a, by !L from 7.
9. !a ⊢ a ⊗ a, by !c from 8.
10. !a ⊢ a ⊗ a, by cut from 3 and 9.</desc>
