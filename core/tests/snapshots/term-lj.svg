<svg xmlns="http://www.w3.org/2000/svg" role="img" width="617.696" height="134.592" viewBox="0 0 38606 8412" font-family="'Euler Math', 'Neo Euler', serif" font-size="1000" fill="black">
<title>a ∨ b, ¬a ⊢ b ∧ ⊤</title>
<desc>1. a ⊢ a, by ax.
2. ⊥ ⊢ b, by ⊥L.
3. a, ¬a ⊢ b, by ¬L from 1 and 2.
4. b ⊢ b, by ax.
5. b, ¬a ⊢ b, by WL from 4.
6. a ∨ b, ¬a ⊢ b, by ∨L from 3 and 5.
7. a ∨ b, ¬a ⊢ ⊤, by ⊤R.
8. a ∨ b, ¬a ⊢ b ∧ ⊤, by ∧R from 6 and 7.</desc>
