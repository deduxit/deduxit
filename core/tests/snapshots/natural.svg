<svg xmlns="http://www.w3.org/2000/svg" role="img" width="253.984" height="99.2" viewBox="0 0 15874 6200" font-family="'Euler Math', 'Neo Euler', serif" font-size="1000" fill="black">
<title>a ∨ b → b ∨ a</title>
<desc>1. [a ∨ b]³, by hypothesis.
2. [a]¹, by hypothesis.
3. b ∨ a, by ∨I₂ from 2.
4. [b]², by hypothesis.
5. b ∨ a, by ∨I₁ from 4.
6. b ∨ a, by ∨E from 1, 3 and 5.
7. a ∨ b → b ∨ a, by →I from 6.</desc>
