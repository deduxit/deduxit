<svg xmlns="http://www.w3.org/2000/svg" role="img" width="1413.088" height="182.592" viewBox="0 0 88318 11412" font-family="'Euler Math', 'Neo Euler', serif" font-size="1000" fill="black">
<title>w0 : □p, w0 : ◇q ⊢ w0 : ◇(□p ∧ q)</title>
<desc>1. w0 : □p, w0 : ◇q, w0 R w1, w1 : q, w1 R w2, w2 : p, w0 R w2 ⊢ w0 : ◇(□p ∧ q), w1 : □p ∧ q, w1 : □p, w2 : p, by ax.
2. w0 : □p, w0 : ◇q, w0 R w1, w1 : q, w1 R w2, w0 R w2 ⊢ w0 : ◇(□p ∧ q), w1 : □p ∧ q, w1 : □p, w2 : p, by L□ from 1.
3. w0 : □p, w0 : ◇q, w0 R w1, w1 : q, w1 R w2 ⊢ w0 : ◇(□p ∧ q), w1 : □p ∧ q, w1 : □p, w2 : p, by Trans from 2.
4. w0 : □p, w0 : ◇q, w0 R w1, w1 : q ⊢ w0 : ◇(□p ∧ q), w1 : □p ∧ q, w1 : □p, by R□ from 3.
5. w0 : □p, w0 : ◇q, w0 R w1, w1 : q ⊢ w0 : ◇(□p ∧ q), w1 : q, w1 : □p ∧ q, by ax.
6. w0 : □p, w0 : ◇q, w0 R w1, w1 : q ⊢ w0 : ◇(□p ∧ q), w1 : □p ∧ q, by R∧ from 4 and 5.
7. w0 : □p, w0 : ◇q, w0 R w1, w1 : q ⊢ w0 : ◇(□p ∧ q), by R◇ from 6.
8. w0 : □p, w0 : ◇q ⊢ w0 : ◇(□p ∧ q), by L◇ from 7.</desc>
