<text x="300" y="13902" textLength="83770" lengthAdjust="spacing" id="term">x : 1 ⊗ !(𝑎 ⊸ 𝑏), y : 𝑎 ⊕ 𝑐 ⊢ let x be z ⊗ u in let z be ∗ in case y of inl(v) → ⟨inl_(𝑏 ⊕ 𝑐)(derelict(u) v), true(u, v)⟩ ‖ inr(w) → discard u in ⟨inr_(𝑏 ⊕ 𝑐)(w), true(w)⟩ : (𝑏 ⊕ 𝑐) &amp; ⊤</text>
