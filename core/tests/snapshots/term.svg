<svg xmlns="http://www.w3.org/2000/svg" role="img" width="1237.472" height="230.592" viewBox="0 0 77342 14412" font-family="'Euler Math', 'Neo Euler', serif" font-size="1000" fill="black">
<title>1 ⊗ !(a ⊸ b), a ⊕ c ⊢ (b ⊕ c) &amp; ⊤</title>
<desc>1. a ⊢ a, by ax.
2. b ⊢ b, by ax.
3. a ⊸ b, a ⊢ b, by ⊸L from 1 and 2.
4. !(a ⊸ b), a ⊢ b, by !L from 3.
5. !(a ⊸ b), a ⊢ b ⊕ c, by ⊕R₁ from 4.
6. !(a ⊸ b), a ⊢ ⊤, by ⊤R.
7. !(a ⊸ b), a ⊢ (b ⊕ c) &amp; ⊤, by &amp;R from 5 and 6.
8. c ⊢ c, by ax.
9. c ⊢ b ⊕ c, by ⊕R₂ from 8.
10. c ⊢ ⊤, by ⊤R.
11. c ⊢ (b ⊕ c) &amp; ⊤, by &amp;R from 9 and 10.
12. !(a ⊸ b), c ⊢ (b ⊕ c) &amp; ⊤, by !w from 11.
13. !(a ⊸ b), a ⊕ c ⊢ (b ⊕ c) &amp; ⊤, by ⊕L from 7 and 12.
14. 1, !(a ⊸ b), a ⊕ c ⊢ (b ⊕ c) &amp; ⊤, by 1L from 13.
15. 1 ⊗ !(a ⊸ b), a ⊕ c ⊢ (b ⊕ c) &amp; ⊤, by ⊗L from 14.</desc>
