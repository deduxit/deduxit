<svg xmlns="http://www.w3.org/2000/svg" role="img" width="713.6" height="134.592" viewBox="0 0 44600 8412" font-family="'Euler Math', 'Neo Euler', serif" font-size="1000" fill="black">
<title>x : a ⊗ !b, f : b ⊸ c ⊢ let x be y ⊗ z in f derelict(z) ⊗ y : c ⊗ a</title>
<desc>1. x : a ⊗ !b ⊢ x : a ⊗ !b, by ax.
2. f : b ⊸ c ⊢ f : b ⊸ c, by ax.
3. z : !b ⊢ z : !b, by ax.
4. z : !b ⊢ derelict(z) : b, by !E from 3.
5. f : b ⊸ c, z : !b ⊢ f derelict(z) : c, by ⊸E from 2 and 4.
6. y : a ⊢ y : a, by ax.
7. f : b ⊸ c, y : a, z : !b ⊢ f derelict(z) ⊗ y : c ⊗ a, by ⊗I from 5 and 6.
8. x : a ⊗ !b, f : b ⊸ c ⊢ let x be y ⊗ z in f derelict(z) ⊗ y : c ⊗ a, by ⊗E from 1 and 7.</desc>
