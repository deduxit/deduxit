# A tag `vX.Y.Z` releases version X.Y.Z: the flake's checks again, the
# crates published to crates.io in their order through Trusted
# Publishing, and a GitHub release with the changelog's section, the
# crates' packages, the command's archives and Linux packages for every
# system (`packages.yml`), their SHA-256 sums in `SHA256SUMS` and an
# attestation of their build. The first version was published by hand,
# since a crate must exist before a workflow may publish it; its tag only
# makes the release.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  check:
    name: tag, changelog and nix flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The tag names the version every manifest inherits and the citation
      # file states, and the changelog has its section, dated.
      - name: The tag, the manifests and the changelog agree
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$TAG" ]; then
            echo "the tag $TAG is not the manifests' version $version" >&2
            exit 1
          fi
          if ! grep -Eq "^## \[$version\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "CHANGELOG.md has no dated section for $version" >&2
            exit 1
          fi
          if ! grep -q "^version: $version$" CITATION.cff; then
            echo "CITATION.cff does not state version $version" >&2
            exit 1
          fi
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          github_access_token: ${{ github.token }}
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: linlog-prover
          # A tag's builds are `main`'s, which uploaded them already.
          skipPush: true
      - run: nix flake check --print-build-logs --keep-going

  publish:
    name: cargo publish
    needs: check
    if: github.ref_name != 'v0.1.0'
    runs-on: ubuntu-latest
    # crates.io's trusted publisher names this environment, whose
    # protection rules may ask for the author's approval.
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          github_access_token: ${{ github.token }}
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: linlog-prover
          skipPush: true
      # The packages built and verified before the token is asked for,
      # since it lives briefly; the publication reuses the build.
      - run: nix develop --command cargo package --locked --package deduxit --package deduxit-cli
      # A token for this job alone, revoked when it ends.
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      # The library before the command, each unless its version is on
      # crates.io already: publishing is not atomic, and a run again after
      # a failure between the two finishes it.
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          for crate in linlog deduxit-cli; do
            if curl --silent --fail --output /dev/null \
              --user-agent "linlog release (github.com/deduxit/deduxit)" \
              "https://crates.io/api/v1/crates/$crate/$version"; then
              echo "$crate $version is on crates.io already"
            else
              nix develop --command cargo publish --locked --package "$crate"
            fi
          done

  packages:
    name: archives and packages
    needs: check
    uses: ./.github/workflows/packages.yml

  release:
    name: GitHub release
    needs: [check, publish, packages]
    # After the publication, or without it for the version published by
    # hand.
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.packages.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: The checksums
        working-directory: dist
        run: sha256sum -- * >SHA256SUMS
      # A provenance attestation of every file the sums name, which
      # `gh attestation verify FILE --repo deduxit/deduxit` checks.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      # The notes are the changelog's section; the crates' packages
      # attached are those crates.io serves, the ones published.
      - name: The release, with the changelog's section as its notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          awk -v head="## [$version]" '
            index($0, head) == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[[^]]*\]: / { exit }
            on { print }
          ' CHANGELOG.md >notes.md
          {
            echo
            echo "Install it as the manual's [Installation](https://deduxit.github.io/deduxit/manual/installation.html) says; \`SHA256SUMS\` holds the files' sums."
          } >>notes.md
          for crate in linlog deduxit-cli; do
            curl --silent --fail --location --output "$crate-$version.crate" \
              --user-agent "linlog release (github.com/deduxit/deduxit)" \
              "https://static.crates.io/crates/$crate/$crate-$version.crate"
          done
          gh release create "$TAG" --title "linlog $version" --notes-file notes.md \
            --verify-tag ./*.crate dist/*
